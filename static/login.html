<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 墨记</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=1.3.6" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="/" class="brand-name">墨记</a>
      <span class="brand-tag">作者登录</span>
    </div>
  </header>
  <div class="auth-card">
    <h1>作者登录</h1>
    <p>预置账号登录后可写稿与删除。</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="error" id="error"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">登录</button>
    </form>
  </div>
  <script src="/static/common.js?v=1.3.6"></script>
  <script src="/static/login.js?v=1.3.6"></script>
</body>
</html>
