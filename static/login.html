<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 墨记</title>
  <script>(function(){try{if(localStorage.getItem("moji-theme")==="night")document.documentElement.setAttribute("data-theme","night");}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=1.3.8" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <a href="/" class="brand-name">墨记</a>
      <span class="brand-tag">作者登录</span>
    </div>
    <nav class="nav">
      <button type="button" class="btn btn-ghost btn-theme" data-theme-toggle title="切换为暗夜模式" aria-label="切换为暗夜模式">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="3.2" r="1.35" fill="currentColor"/><circle cx="18.2" cy="5.8" r="1.35" fill="currentColor"/><circle cx="20.8" cy="12" r="1.35" fill="currentColor"/><circle cx="18.2" cy="18.2" r="1.35" fill="currentColor"/><circle cx="12" cy="20.8" r="1.35" fill="currentColor"/><circle cx="5.8" cy="18.2" r="1.35" fill="currentColor"/><circle cx="3.2" cy="12" r="1.35" fill="currentColor"/><circle cx="5.8" cy="5.8" r="1.35" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>
  <div class="auth-card">
    <h1>作者登录</h1>
    <p>预置账号登录后可写稿与删除。</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="error" id="error"></div>
      <button class="btn btn-primary" type="submit" style="width:100%">登录</button>
    </form>
  </div>
  <script src="/static/common.js?v=1.3.8"></script>
  <script src="/static/login.js?v=1.3.8"></script>
</body>
</html>
